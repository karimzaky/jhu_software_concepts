name: Module 5 Secure Development

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: module_5
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: gradcafe_module5_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gradcafe_module5_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gradcafe_module5_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gradcafe_module5_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set up Node for Snyk CLI
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies and editable project
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
          python -m pip check
          sudo apt-get update
          sudo apt-get install -y graphviz
          npm install --global snyk@1.1307.4
      - name: 1. Enforce Pylint 10 out of 10
        run: |
          set -o pipefail
          python -m pylint src --fail-under=10 2>&1 | tee pylint_ci.txt
      - name: 2. Generate and validate dependency graph
        if: ${{ !cancelled() }}
        run: |
          PYTHONPATH=src python -m pydeps src/app.py --noshow -T svg -o dependency.svg
          test -s dependency.svg
          python -c "import xml.etree.ElementTree as ET; root = ET.parse('dependency.svg').getroot(); assert root.tag == '{http://www.w3.org/2000/svg}svg'"
      - name: 3. Scan dependencies with Snyk
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set -o pipefail
          if [ -z "$SNYK_TOKEN" ]; then
            echo "Missing repository Actions secret SNYK_TOKEN." | tee snyk_ci.txt
            exit 2
          fi
          snyk test --file=requirements.txt --command="$(command -v python)" 2>&1 | tee snyk_ci.txt
      - name: 4. Run pytest with 100 percent coverage
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          python -m pytest 2>&1 | tee coverage_summary.txt
      - name: Save verification evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: module-5-verification
          path: |
            module_5/pylint_ci.txt
            module_5/dependency.svg
            module_5/snyk_ci.txt
            module_5/coverage_summary.txt
          if-no-files-found: error
